{% extends 'base.html' %}

{% block title %}Radio{% endblock %}

{% block content %}
<header>
    <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('contact') }}">Contact</a>
        <a href="{{ url_for('games') }}">Games</a>
        <a href="{{ url_for('community') }}">Community</a>
        <a href="{{ url_for('radio_page') }}" class="current">Radio</a>
        <a href="{{ url_for('levels_list') }}">Lists</a>
        <a class="change-theme-button" onclick="toggleDarkMode()">Theme</a>
        {% if logged_in %}
            <a href="{{ url_for('user_profile', profile=username) }}">{{ username }}</a>
        {% else %}
            <a href="{{ url_for('log_in') }}">Log In</a>
        {% endif %}
    </nav>
</header>

<main>
    <div style="display: flex; justify-content: center;"><div class="level-page-container" style="width: fit-content; min-width: 300px;">
        <h1 style="margin-bottom: 0;">Gild Radio</h1>
        <p style="margin-top: 5px; margin-bottom: 30px;">Wait a few seconds when loading</p>
        <audio id="radio" autoplay></audio>
        <img id="cover" src="" height="200" alt="song's cover" style="border-radius: 10px;">
        <h2 id="title" style="margin-bottom: 5px; margin-top: 0"></h2>
        <h3 id="author" style="margin-top: 0;"></h3>
        <span style="font-size: large;">Volume</span>
        <p style="margin: 0;"><input type="range" id="volume" min="0" max="1" step="0.01" value="1" style="border: none; background-color: transparent !important;"></p>
    </div></div>

</main>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='js/radio.js') }}"></script>
{% endblock %}
