{% extends 'base.html' %}

{% block title %}Home Page{% endblock %}

{% block content %}
<header>
    <nav>
        <a href="{{ url_for('index') }}" class="current">Home</a>
        <a href="{{ url_for('contact') }}">Contact</a>
        <a href="{{ url_for('games') }}">Games</a>
        <a href="{{ url_for('community') }}">Community</a>
        <a href="{{ url_for('radio_page') }}">Radio</a>
        <a href="{{ url_for('levels_list') }}">Lists</a>
        <a class="change-theme-button" onclick="toggleDarkMode()">Theme</a>
        {% if logged_in %}
            <a href="{{ url_for('user_profile', profile=username) }}">{{ username }}</a>
        {% else %}
            <a href="{{ url_for('log_in') }}">Log In</a>
        {% endif %}
    </nav>
</header>

<main>
    <hr class="small-margin-top">
    <h1>Gild Tournament Season 1</h1>
    <iframe src="https://brackethq.com/b/p18fd/embed/" width="100%" height="550" frameborder="0"></iframe>

    <hr class="small-margin-top">
    <h1>Gild Tournament Season 2</h1>
    <iframe src="https://brackethq.com/b/708fd/embed/" width="100%" height="550" frameborder="0"></iframe>

    <hr class="small-margin-top">
    <h1>Gild Tournament Season 3</h1>
    <iframe style="margin-bottom: 20px;" src="https://brackethq.com/b/sxadd/embed/" width="100%" height="550" frameborder="0"></iframe>
</main>
{% endblock %}
